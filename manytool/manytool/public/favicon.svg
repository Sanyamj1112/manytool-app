<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Hexagon outer shape -->
  <polygon points="50,4 93,27 93,73 50,96 7,73 7,27" fill="#0a0f1e" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#glow)"/>
  <!-- Gear outer ring -->
  <circle cx="50" cy="52" r="22" fill="none" stroke="url(#cyanPurple)" stroke-width="3.5" stroke-dasharray="6 3"/>
  <!-- Gear center hole -->
  <circle cx="50" cy="52" r="8" fill="#0a0f1e" stroke="url(#cyanPurple)" stroke-width="2.5"/>
  <!-- Wrench shape -->
  <path d="M38,28 C35,22 41,16 47,19 L44,24 L47,27 L55,35 L57,33 L60,30 C66,34 65,42 60,44 L44,60 C42,67 34,68 30,63 C26,58 28,50 35,49 L51,33 Z" fill="none" stroke="url(#cyanPurple)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Inner dot accent -->
  <circle cx="50" cy="52" r="3.5" fill="url(#cyanPurple)"/>
</svg>